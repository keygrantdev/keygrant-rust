name: publish

# A version tag (0.2.0, no "v") packages the keygrant crate, then publishes it to crates.io through
# crates.io's trusted publishing: the token is short-lived and made for this run, and none is stored
# anywhere. The build job cannot request an identity token; the publish job, which can, runs no build script
# (cargo publish --no-verify: the build job's cargo package built this crate from this commit). A version
# already on crates.io is skipped.

# Run by hand from the Actions tab, from the tag itself (Use workflow from: the tag), it publishes that tag
# the same way: the rescue for a tag whose push started no run. Never from a branch: the package's provenance
# names the commit of the run's own ref.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  RELEASE: KeyGrant Rust SDK

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.out.outputs.publish }}
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - name: Check the run is for a version tag
        working-directory: .
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Run this from a version tag (Use workflow from: the tag, such as 0.3.1), never from a branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check the tag is a KeyGrant release
        working-directory: .
        run: |
          # Only what the release pipeline made is published: an annotated tag by KeyGrant, on KeyGrant's
          # release commit for this version. Its source commit ran the SDK's suite before the tag was pushed.
          git fetch --quiet --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          keygrant='KeyGrant <dev@keygrant.dev>'
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ] \
            || [ "$(git for-each-ref --format='%(taggername) %(taggeremail)' "refs/tags/$TAG")" != "$keygrant" ] \
            || [ "$(git log -1 --format='%an <%ae>|%cn <%ce>' "refs/tags/$TAG^{commit}")" != "$keygrant|$keygrant" ] \
            || [ "$(git log -1 --format=%B "refs/tags/$TAG^{commit}")" != "$RELEASE $TAG" ]; then
            echo "::error::$TAG is not a release the KeyGrant release pipeline made (an annotated tag by KeyGrant on its release commit): nothing is published."
            exit 1
          fi
      - name: Check the tag is the crate's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | sed -n 's/.*"name":"keygrant","version":"\([^"]*\)".*/\1/p')
          if [ "$version" != "$TAG" ]; then
            echo "::error::The tag $TAG is not the version in Cargo.toml ($version)."
            exit 1
          fi
      - name: Check whether crates.io has it already
        id: out
        run: |
          if curl -fsS --max-time 30 https://index.crates.io/ke/yg/keygrant | grep -q "\"vers\":\"$TAG\""; then
            echo "::notice::keygrant $TAG is already on crates.io: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # No test suite here: the SDK's suite and its conformance vectors ran on the source commit this export was
      # made from, before the tag was pushed. This job proves the artifact: built from the tagged source, then
      # checked.
      - name: Package
        if: steps.out.outputs.publish == 'true'
        run: |
          cargo --version
          cargo package --locked

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish to crates.io
        working-directory: sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
